services:
  habitta-db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file:
      - /opt/secrets/habitta-db.env
    volumes:
      - habitta_db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - habitta-internal
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  habitta-web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DEMO_MODE: "true"
        NEXT_PUBLIC_DEMO_MODE: "true"
    restart: unless-stopped
    env_file:
      - /opt/secrets/habitta.env
    depends_on:
      habitta-db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - habitta-internal
      - edge
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  habitta_db_data:
    name: habitta_db_data

networks:
  habitta-internal:
    internal: true
  edge:
    external: true
